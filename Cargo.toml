[workspace]
resolver = "2"
members = ["crates/bs1770", "crates/lufs", "crates/bs1770-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/twwalsh/loudness"
authors = ["Tim Walsh <tw@twwalsh.com>"]

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Audio math is written as the spec writes it; these three lints fight that.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
many_single_char_names = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
